<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color RGB</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    
    <div class="contenedor-principal">
        <div class="contenedor-interno">

            <div class="color">
                <label for="rojo" id="label-rojo">Rojo</label>
                <input type="range" id="rojo" min="0" max="255" value="23" step="1">
                <p id="texto-rojo"></p>
            </div>

            <div class="color">
                <label for="verde" id="label-verde">Verde</label>
                <input type="range" id="verde" min="0" max="255" value="41" step="1">
                <p id="texto-verde"></p>
            </div>

            <div class="color">
                <label for="azul" id="label-azul">Azul</label>
                <input type="range" id="azul" min="0" max="255" value="56" step="1">
                <p id="texto-azul"></p>
            </div>
        </div>
    </div>

</body>

</html>
