<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administracion</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js"></script>
</head>

<body>
  <div class="panel">
    <h2>Gestión Hotel</h2>

    <form id="form-registro">
      <input type="text" id="nombre-cliente" placeholder="Nombre del cliente" required>
      <button type="submit">Registrar Entrada</button>
    </form>

    <div id="reserva-vip" class="tarjeta-vip">
      <h3>Suite Presidencial - Ocupada</h3>
      <p>Haz clic en la tarjeta para ver detalles completos.</p>
      <button id="btn-evacuar">Evacuar Suite</button>
    </div>

    <h3>Estado de Limpieza</h3>
      <ul id="lista-habitaciones">
        <li class="habitacion">Hab 101 <button class="btn-limpiar">Marcar Limpia</button></li>
        <li class="habitacion">Hab 102 <button class="btn-limpiar">Marcar Limpia</button></li>
        <li class="habitacion">Hab 103 <button class="btn-limpiar">Marcar Limpia</button></li>
      </ul>
  </div>
</body>
</html>
