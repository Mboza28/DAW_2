<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">
        <h1 class="titulo">Login</h1>
        <form action="http://localhost:4004/inicio/login" method="post">
            <label for="correo" class="etiqueta">Correo:</label>
            <input type="text" name="correo" id="correo" placeholder="Introduce tu correo">
            <label for="pass" class="etiqueta">Contraseña:</label>
            <input type="text" name="pass" id="password" placeholder="Contraseña">
            <button type="submit" id="btn-login">Iniciar sesión</button>
        </form>
        <p>Si aún no tienes una cuenta <br><a href="register.html">REGISTRATE AQUI</a>
    </div>

</body>
</html>
